[project]
name = "linux-gnome-automations"
version = "0.1.0"
description = "MCP server playground using uv"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.24.0",
    "mypy>=1.19.0",
    "pydantic>=2.12.5",
]

[project.scripts]
mcp-server = "mcp_server.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server"]

[dependency-groups]
dev = [
    "mypy>=1.19.0",
]
